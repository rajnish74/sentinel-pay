# Dev-specific overrides
spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/sentinelpay_db
    username: sentinelpay
    password: sentinelpay_dev_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    show-sql: true

logging:
  level:
    com.sentinelpay: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO
